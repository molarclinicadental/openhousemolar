<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bruja verde 3D</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140a22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:#140a22; --texto:#f4ecff; --suave:#bfaee0; --naranja:#ff8a1f; --morado:#5d2b8c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--fondo);color:var(--texto);
    font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{
    background:
      radial-gradient(circle at 78% 16%, rgba(255,236,180,.35) 0 40px, rgba(255,200,120,.12) 41px 120px, transparent 260px),
      radial-gradient(ellipse at 50% 88%, #3a1d5c 0%, transparent 60%),
      linear-gradient(#0c0616, #1d0f33 55%, #140a22);
  }
  .luna{position:fixed;right:calc(22% - 34px);top:calc(16% - 34px);width:68px;height:68px;border-radius:50%;
    background:radial-gradient(circle at 38% 36%, #fff8e0, #f3dca0 60%, #d9b870);
    box-shadow:0 0 50px rgba(255,220,140,.45);pointer-events:none}
  canvas#escena{position:fixed;inset:0;width:100%;height:100vh;height:100svh;display:block;touch-action:none;outline:none}
  header{position:fixed;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top)) 16px 0;text-align:center;pointer-events:none}
  header h1{margin:0;font-family:Creepster,cursive;font-weight:400;font-size:clamp(28px,6vw,46px);letter-spacing:1px;
    color:var(--naranja);text-shadow:0 3px 0 #3b1500,0 0 18px rgba(255,138,31,.45)}
  header p{margin:4px 0 0;font-size:14px;color:var(--suave)}
  .botones{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;
    justify-content:center;gap:8px;padding:0 16px}
  .botones button{font:800 15px Nunito,sans-serif;color:#fff;background:rgba(93,43,140,.85);border:2px solid rgba(255,255,255,.18);
    border-radius:999px;padding:10px 16px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 4px 0 #2c1146;transition:transform .12s}
  .botones button:active{transform:translateY(3px);box-shadow:0 1px 0 #2c1146}
  .botones button.activo{background:var(--naranja);box-shadow:0 4px 0 #8a3f00}
  .aviso{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:var(--suave)}
  .aviso.ver{display:grid}
  .cargando{position:fixed;inset:0;display:grid;place-items:center;color:var(--suave);font-size:15px;pointer-events:none;transition:opacity .4s}
  .cargando.fuera{opacity:0}
</style>
</head>
<body>
<div class="luna"></div>
<canvas id="escena" aria-label="Monstruo verde vestido de bruja en 3D. Arrastra para girarlo."></canvas>
<header>
  <h1>La bruja verde</h1>
  <p>Arrástrala para girarla 360° · Tócala para que salte</p>
</header>
<div class="cargando" id="cargando">Preparando el caldero…</div>
<div class="aviso" id="aviso">Tu navegador no pudo mostrar el 3D. Prueba con Chrome o Safari actualizados.</div>
<div class="botones">
  <button type="button" id="bSaludar">👋 Saludar</button>
  <button type="button" id="bSaltar">🦘 Saltar</button>
  <button type="button" id="bBailar">💃 Bailar</button>
  <button type="button" id="bEstilo">✏️ Estilo dibujo</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script>
  setTimeout(function(){ if(!window.__monstruoListo){ document.getElementById('aviso').classList.add('ver'); document.getElementById('cargando').classList.add('fuera'); } }, 9000);
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const lienzo = document.getElementById('escena');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: lienzo, antialias: true, alpha: true });
} catch (e) {
  document.getElementById('aviso').classList.add('ver');
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const escena = new THREE.Scene();
const camara = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camara.position.set(0, 2.5, 8.6);

const controles = new OrbitControls(camara, lienzo);
controles.target.set(0, 1.95, 0);
controles.enableDamping = true;
controles.enablePan = false;
controles.minDistance = 5;
controles.maxDistance = 13;
controles.minPolarAngle = 0.35;
controles.maxPolarAngle = 1.52;
controles.autoRotate = true;
controles.autoRotateSpeed = 0.9;
controles.update();
let reanudarGiro = null;
controles.addEventListener('start', () => { controles.autoRotate = false; clearTimeout(reanudarGiro); });
controles.addEventListener('end', () => { reanudarGiro = setTimeout(() => controles.autoRotate = true, 6000); });

// ---------- Luces ----------
escena.add(new THREE.HemisphereLight(0xd6dcff, 0x3a1f4f, 0.9));
const sol = new THREE.DirectionalLight(0xfff1dc, 2.7);
sol.position.set(3, 7, 5);
sol.castShadow = true;
sol.shadow.mapSize.set(1024, 1024);
Object.assign(sol.shadow.camera, { left: -3.2, right: 3.2, top: 5, bottom: -1.5, near: 1, far: 20 });
sol.shadow.radius = 5;
sol.shadow.bias = -0.0005;
sol.shadow.normalBias = 0.02;
escena.add(sol);
const contraluz = new THREE.DirectionalLight(0xff8a2a, 2.2);
contraluz.position.set(-4, 3.5, -4.5);
escena.add(contraluz);
const relleno = new THREE.DirectionalLight(0xa47bff, 0.9);
relleno.position.set(-5, 2, 3);
escena.add(relleno);

// ---------- Material de plastilina ----------
function texturaHuellas() {
  const chico = document.createElement('canvas');
  chico.width = chico.height = 40;
  const gc = chico.getContext('2d');
  const datos = gc.createImageData(40, 40);
  for (let i = 0; i < 1600; i++) {
    const v = 112 + Math.random() * 32;
    datos.data[i * 4] = datos.data[i * 4 + 1] = datos.data[i * 4 + 2] = v;
    datos.data[i * 4 + 3] = 255;
  }
  gc.putImageData(datos, 0, 0);
  const c = document.createElement('canvas');
  c.width = c.height = 160;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = true;
  g.drawImage(chico, 0, 0, 160, 160);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2, 2);
  return t;
}
const huellas = texturaHuellas();

function barro(color, extra = {}) {
  const base = new THREE.Color(color);
  return new THREE.MeshPhysicalMaterial(Object.assign({
    color: base,
    roughness: 0.6,
    metalness: 0,
    clearcoat: 0.22,
    clearcoatRoughness: 0.55,
    sheen: 0.55,
    sheenRoughness: 0.8,
    sheenColor: new THREE.Color(0xffffff).lerp(base, 0.4),
    bumpMap: huellas,
    bumpScale: 0.9,
  }, extra));
}

// Contorno tipo dibujo (casco invertido), se activa con el botón
const contornos = [];
const matContorno = new THREE.ShaderMaterial({
  uniforms: { grosor: { value: 0.03 } },
  vertexShader: `uniform float grosor;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vec3 n = normalize(normalMatrix * normal);
      mv.xyz += n * grosor;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `void main(){ gl_FragColor = vec4(0.06, 0.09, 0.05, 1.0); }`,
  side: THREE.BackSide,
});

function pieza(geo, mat, padre, { pos, rot, esc, sombra = true, contorno = true } = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(...pos);
  if (rot) m.rotation.set(...rot);
  if (esc) m.scale.set(...esc);
  m.castShadow = sombra;
  m.receiveShadow = true;
  padre.add(m);
  if (contorno) {
    const o = new THREE.Mesh(geo, matContorno);
    o.visible = false;
    o.raycast = () => {};
    m.add(o);
    contornos.push(o);
  }
  return m;
}

const suave = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

// ---------- Colores ----------
const C = {
  verde: '#38a02e', panza: '#8fd65c', verdeOscuro: '#1f6b1c', ceja: '#1d5a19', boca: '#173a13',
  blanco: '#fbfbf4', iris: '#2f6e2b', pupila: '#10140f', cuerno: '#e9c79b', cuernoBanda: '#b98d5c',
  sombrero: '#5d2b8c', banda: '#ff8a1f', oro: '#f5c542', calabaza: '#f07a1c', tallo: '#5a7a2a', suelo: '#2a1942',
};

// ---------- Monstruo ----------
const monstruo = new THREE.Group();   // raíz: saltos y giros (pivote en los pies)
escena.add(monstruo);
const cuerpo = new THREE.Group();     // respiración, caras y brazos
cuerpo.position.y = 0.42;
monstruo.add(cuerpo);

// Cuerpo en forma de frijol (torno + escala en profundidad)
const PROF = 0.86;
const perfil = new THREE.SplineCurve([
  [0, 0], [0.5, 0.03], [0.76, 0.16], [0.86, 0.45], [0.86, 0.85], [0.81, 1.3],
  [0.76, 1.7], [0.71, 1.98], [0.58, 2.2], [0.36, 2.33], [0, 2.37],
].map(p => new THREE.Vector2(p[0], p[1])));
const puntos = perfil.getPoints(64).map(p => new THREE.Vector2(Math.max(p.x, 0), p.y));
puntos[0].x = 0;
puntos[puntos.length - 1].x = 0;

function radioEn(y) {
  for (let i = 1; i < puntos.length; i++) {
    if (puntos[i].y >= y) {
      const a = puntos[i - 1], b = puntos[i];
      return a.x + (b.x - a.x) * ((y - a.y) / ((b.y - a.y) || 1));
    }
  }
  return 0;
}
const supZ = (x, y) => Math.sqrt(Math.max(radioEn(y) ** 2 - x * x, 0)) * PROF;

const geoCuerpo = new THREE.LatheGeometry(puntos, 72);
geoCuerpo.scale(1, 1, PROF);
{
  const p = geoCuerpo.attributes.position, n = geoCuerpo.attributes.normal;
  const cols = new Float32Array(p.count * 3);
  const cBase = new THREE.Color(C.verde), cPanza = new THREE.Color(C.panza), cOsc = new THREE.Color(C.verdeOscuro);
  const c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i), nz = n.getZ(i), nx = n.getX(i);
    c.copy(cBase);
    const frente = suave(0.15, 0.85, nz);
    const panza = Math.exp(-(((y - 0.8) / 0.5) ** 2)) * suave(0.35, -0.1, nx * 0.6 + 0.1);
    const frenteAlta = Math.exp(-(((y - 2.05) / 0.2) ** 2)) * 0.35;
    c.lerp(cPanza, Math.min(1, frente * (panza * 0.85 + frenteAlta)));
    c.lerp(cOsc, suave(0.0, -0.9, nz) * 0.5 + suave(0.45, 0.05, y) * 0.35 + suave(0.3, 0.9, Math.abs(nx)) * 0.2);
    cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
  }
  geoCuerpo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
}
const matCuerpo = barro('#ffffff', { vertexColors: true });
const mallaCuerpo = pieza(geoCuerpo, matCuerpo, cuerpo);

// Manchitas oscuras (como en el dibujo)
const matManchas = barro(C.verdeOscuro);
[[-0.52, 0.55, 0.05], [-0.44, 0.42, 0.04], [-0.58, 0.72, 0.035], [-0.36, 0.62, 0.03], [-0.5, 0.3, 0.03]].forEach(([x, y, r]) => {
  pieza(new THREE.SphereGeometry(r, 12, 8), matManchas, cuerpo, { pos: [x, y, supZ(x, y) - r * 0.55], sombra: false, contorno: false });
});

// Ojos
const matBlanco = barro(C.blanco, { roughness: 0.35, clearcoat: 0.6, bumpScale: 0.2 });
const matIris = barro(C.iris, { roughness: 0.3, clearcoat: 0.8, bumpMap: null });
const matPupila = new THREE.MeshPhysicalMaterial({ color: C.pupila, roughness: 0.2, clearcoat: 1 });
const matBrillo = new THREE.MeshBasicMaterial({ color: 0xffffff });
const ojos = [];
[-1, 1].forEach(lado => {
  const x = 0.3 * lado, y = 1.78;
  const ojo = new THREE.Group();
  ojo.position.set(x, y, supZ(x, y) - 0.05);
  ojo.rotation.y = lado * 0.22;
  cuerpo.add(ojo);
  pieza(new THREE.SphereGeometry(0.25, 32, 24), matBlanco, ojo, { esc: [1, 1.12, 0.62] });
  const pupila = new THREE.Group();
  pupila.position.z = 0.13;
  ojo.add(pupila);
  pieza(new THREE.SphereGeometry(0.14, 24, 16), matIris, pupila, { esc: [1, 1, 0.35], sombra: false, contorno: false });
  pieza(new THREE.SphereGeometry(0.085, 20, 14), matPupila, pupila, { pos: [0, 0, 0.022], esc: [1, 1, 0.35], sombra: false, contorno: false });
  pieza(new THREE.SphereGeometry(0.032, 12, 8), matBrillo, pupila, { pos: [0.045, 0.05, 0.06], sombra: false, contorno: false });
  pieza(new THREE.SphereGeometry(0.016, 10, 6), matBrillo, pupila, { pos: [-0.04, -0.045, 0.058], sombra: false, contorno: false });
  ojos.push({ ojo, pupila });
});

// Cejas y boca siguiendo la superficie del cuerpo
const matOscuro = barro(C.ceja, { bumpMap: null });
function tuboSobreCuerpo(fn, radio, mat, n = 16) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const [x, y] = fn(i / n);
    pts.push(new THREE.Vector3(x, y, supZ(x, y) + 0.005));
  }
  return pieza(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, radio, 8), mat, cuerpo, { sombra: false });
}
[-1, 1].forEach(lado => {
  tuboSobreCuerpo(t => {
    const u = t * 2 - 1;
    return [lado * 0.3 + u * 0.15, 2.08 + 0.05 * (1 - u * u) + lado * u * 0.02];
  }, 0.028, matOscuro, 8);
});
const matBoca = barro(C.boca, { bumpMap: null });
tuboSobreCuerpo(t => {
  const u = t * 2 - 1;
  return [u * 0.44, 1.27 + 0.13 * u * u + (Math.abs(u) > 0.9 ? (Math.abs(u) - 0.9) * 0.5 : 0)];
}, 0.03, matBoca, 20);
// Dientes
const matDiente = barro('#fffbe6', { roughness: 0.35, bumpScale: 0.2 });
[[-0.12, 0.1], [0.19, 0.085]].forEach(([x, h]) => {
  const y = 1.27 + 0.13 * (x / 0.44) ** 2 - h * 0.5;
  pieza(new THREE.ConeGeometry(0.052, h, 12), matDiente, cuerpo, { pos: [x, y, supZ(x, y) + 0.01], rot: [Math.PI, 0, 0], esc: [1, 1, 0.6], sombra: false });
});

// Cuernos (cono curvado con franjas)
function geoCuerno() {
  const alto = 0.78;
  const perfilCuerno = [[0, -0.05], [0.2, -0.04], [0.2, 0.08], [0.17, 0.28], [0.12, 0.48], [0.065, 0.66], [0.02, 0.76], [0, 0.78]].map(p => new THREE.Vector2(p[0], p[1]));
  const g = new THREE.LatheGeometry(new THREE.SplineCurve(perfilCuerno).getPoints(40).map(p => new THREE.Vector2(Math.max(p.x, 0), p.y)), 32);
  const p = g.attributes.position;
  const cols = new Float32Array(p.count * 3);
  const a = new THREE.Color(C.cuerno), b = new THREE.Color(C.cuernoBanda), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const k = p.getY(i) / alto;
    p.setX(i, p.getX(i) - 0.3 * Math.max(k, 0) ** 2);
    const banda = k < 0.75 ? suave(0.35, 0.75, Math.sin(k * 11 - 0.6)) : 0;
    c.copy(a).lerp(b, banda * 0.85);
    cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  g.computeVertexNormals();
  return g;
}
const gCuerno = geoCuerno();
const matCuerno = barro('#ffffff', { vertexColors: true, bumpMap: null, roughness: 0.5 });
[-1, 1].forEach(lado => {
  { const cu = pieza(gCuerno, matCuerno, cuerpo, { pos: [0.5 * lado, 1.86, -0.02], rot: [0.05, 0, -0.95 * lado], esc: [lado, 1, 1] }); cu.castShadow = false; cu.receiveShadow = false; }
});

// Brazos articulados: hombro → codo → mano
const matVerde = barro(C.verde);
function brazo(lado) {
  const hombro = new THREE.Group();
  hombro.position.set(0.8 * lado, 1.2, 0.04);
  cuerpo.add(hombro);
  pieza(new THREE.CapsuleGeometry(0.14, 0.3, 8, 16), matVerde, hombro, { pos: [0, -0.26, 0] });
  const codo = new THREE.Group();
  codo.position.y = -0.5;
  hombro.add(codo);
  pieza(new THREE.CapsuleGeometry(0.125, 0.24, 8, 16), matVerde, codo, { pos: [0, -0.2, 0] });
  const mano = new THREE.Group();
  mano.position.y = -0.44;
  codo.add(mano);
  pieza(new THREE.SphereGeometry(0.17, 20, 16), matVerde, mano, { esc: [1, 1.05, 0.62] });
  [-0.085, 0, 0.085].forEach((dx, i) => {
    pieza(new THREE.CapsuleGeometry(0.052, 0.1, 6, 10), matVerde, mano, { pos: [dx, -0.2 + (i === 1 ? -0.02 : 0), 0], rot: [0, 0, -dx * 2.2] });
  });
  pieza(new THREE.CapsuleGeometry(0.05, 0.08, 6, 10), matVerde, mano, { pos: [-0.16 * lado, -0.02, 0.02], rot: [0, 0, 1.0 * lado] });
  return { hombro, codo, mano };
}
const brazoD = brazo(1);   // el que saluda (derecha de la pantalla)
const brazoI = brazo(-1);

// Piernas y pies
function pierna(lado) {
  const cadera = new THREE.Group();
  cadera.position.set(0.36 * lado, 0.6, 0);
  monstruo.add(cadera);
  pieza(new THREE.CapsuleGeometry(0.17, 0.22, 8, 16), matVerde, cadera, { pos: [0, -0.22, 0] });
  pieza(new THREE.SphereGeometry(0.2, 24, 16), matVerde, cadera, { pos: [0.02 * lado, -0.47, 0.1], esc: [1.05, 0.62, 1.45] });
  return cadera;
}
const piernaD = pierna(1), piernaI = pierna(-1);

// Sombrero de bruja
const sombrero = new THREE.Group();
sombrero.position.set(0.04, 2.13, -0.02);
sombrero.rotation.set(-0.08, 0, -0.14);
cuerpo.add(sombrero);
const matSombrero = barro(C.sombrero);
{
  const g = new THREE.CylinderGeometry(0.88, 0.9, 0.055, 72, 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), r = Math.hypot(x, z);
    if (r > 0.5) p.setY(i, p.getY(i) + 0.04 * Math.sin(Math.atan2(z, x) * 3) * (r - 0.5) / 0.4);
  }
  g.computeVertexNormals();
  pieza(g, matSombrero, sombrero);
}
{
  const perfilCono = [[0.53, 0], [0.48, 0.3], [0.39, 0.6], [0.27, 0.9], [0.15, 1.15], [0.06, 1.34], [0, 1.42]].map(p => new THREE.Vector2(p[0], p[1]));
  const g = new THREE.LatheGeometry(new THREE.SplineCurve(perfilCono).getPoints(30), 48);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i);
    if (y > 0.55) {
      const k = (y - 0.55) / 0.87;
      p.setX(i, p.getX(i) - 0.42 * k * k);
      p.setZ(i, p.getZ(i) - 0.12 * k * k);
      p.setY(i, y - 0.16 * k * k * k);
    }
  }
  g.computeVertexNormals();
  pieza(g, matSombrero, sombrero);
}
pieza(new THREE.CylinderGeometry(0.505, 0.53, 0.17, 48, 1, true), barro(C.banda, { side: THREE.DoubleSide }), sombrero, { pos: [0, 0.11, 0] });
{
  const hebilla = new THREE.Group();
  hebilla.position.set(0, 0.11, 0.52);
  sombrero.add(hebilla);
  const matOro = new THREE.MeshPhysicalMaterial({ color: C.oro, metalness: 0.75, roughness: 0.3, clearcoat: 0.5 });
  [[0, 0.075, 0.2, 0.035], [0, -0.075, 0.2, 0.035], [-0.085, 0, 0.035, 0.18], [0.085, 0, 0.035, 0.18]].forEach(([x, y, w, h]) => {
    pieza(new THREE.BoxGeometry(w, h, 0.035), matOro, hebilla, { pos: [x, y, 0], sombra: false });
  });
}

// ---------- Escenario ----------
pieza(new THREE.CylinderGeometry(2.6, 2.75, 0.14, 72), barro(C.suelo, { bumpScale: 1.4, sheen: 0.2 }), escena, { pos: [0, -0.07, 0], sombra: false, contorno: false });
function calabaza(x, z, s, giro) {
  const g = new THREE.SphereGeometry(0.5, 48, 28);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const px = p.getX(i), pz = p.getZ(i);
    const f = 1 + 0.07 * Math.cos(Math.atan2(pz, px) * 8) * Math.min(1, Math.hypot(px, pz) * 3);
    p.setXYZ(i, px * f, p.getY(i) * 0.74, pz * f);
  }
  g.computeVertexNormals();
  const grupo = new THREE.Group();
  grupo.position.set(x, 0.37 * s, z);
  grupo.scale.setScalar(s);
  grupo.rotation.y = giro;
  escena.add(grupo);
  pieza(g, barro(C.calabaza), grupo);
  pieza(new THREE.CylinderGeometry(0.05, 0.07, 0.22, 10), barro(C.tallo), grupo, { pos: [0.02, 0.44, 0], rot: [0, 0, -0.25] });
  return grupo;
}
calabaza(-1.55, 0.7, 0.75, 0.4);
calabaza(1.7, -0.3, 0.55, 1.2);
calabaza(1.25, 1.05, 0.38, 2.1);

// ---------- Animación ----------
const estado = {
  saludo: 0, saludoDur: 2.6,
  salto: -1,
  baile: false,
  proxParpadeo: 1.5, inicioParpadeo: -1, doble: false,
  proxSaludoAuto: 3,
};
const puntero = new THREE.Vector2(0, 0);
const mirada = new THREE.Vector2(0, 0);

function saludar() { if (estado.saludo <= 0) estado.saludo = estado.saludoDur; }
function saltar() { if (estado.salto < 0) estado.salto = 0; }

const reloj = new THREE.Clock();
const lerp = (a, b, t) => a + (b - a) * t;
const facil = t => t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;

function animar() {
  const dt = Math.min(reloj.getDelta(), 0.05);
  const t = reloj.elapsedTime;

  // Reposo: respiración y balanceo
  const resp = Math.sin(t * 2.2);
  cuerpo.scale.set(1 + 0.014 * resp, 1 - 0.012 * resp, 1 + 0.014 * resp);
  cuerpo.rotation.set(0, 0, Math.sin(t * 1.1) * 0.025);
  let y = 0, sy = 1, sxz = 1, giroY = 0, balanceo = 0;
  let hD = 0.48 + Math.sin(t * 1.7) * 0.05, cD = -0.1, mD = 0;
  let hI = -0.48 - Math.sin(t * 1.7 + 1) * 0.05, cI = 0.1;
  let levD = 0, levI = 0;

  // Saludo automático de vez en cuando
  if (!estado.baile && estado.salto < 0 && t > estado.proxSaludoAuto) {
    saludar();
    estado.proxSaludoAuto = t + 8 + Math.random() * 4;
  }

  // Saludo: el brazo sube desde el hombro y la mano se agita en el codo
  if (estado.saludo > 0) {
    const pasado = estado.saludoDur - estado.saludo;
    const e = facil(Math.min(1, pasado / 0.35, estado.saludo / 0.35));
    hD = lerp(hD, 2.45, e);
    cD = lerp(cD, 0.25 + Math.sin(t * 13) * 0.45, e);
    mD = e * Math.sin(t * 13 + 0.7) * 0.25;
    cuerpo.rotation.z += e * -0.06;
    estado.saludo -= dt;
  }

  // Baile
  if (estado.baile) {
    const b = t * 7;
    balanceo = Math.sin(b) * 0.12;
    y = Math.abs(Math.sin(b)) * 0.12;
    hD = 1.7 + Math.sin(b) * 0.9; cD = 0.4;
    hI = -(1.7 - Math.sin(b) * 0.9); cI = -0.4;
    levD = Math.max(0, Math.sin(b)) * 0.14;
    levI = Math.max(0, -Math.sin(b)) * 0.14;
    cuerpo.rotation.y = Math.sin(b / 2) * 0.3;
  } else {
    cuerpo.rotation.y *= 0.9;
  }

  // Salto con giro: agacharse, volar, aterrizar
  if (estado.salto >= 0) {
    estado.salto += dt;
    const s = estado.salto;
    const A = 0.18, V = 0.66, L = 0.26;
    if (s < A) {
      const k = Math.sin((s / A) * Math.PI / 2);
      sy = 1 - 0.22 * k; sxz = 1 + 0.14 * k;
      hD = lerp(hD, 0.1, k); hI = lerp(hI, -0.1, k);
    } else if (s < A + V) {
      const k = (s - A) / V;
      y = 4 * 0.8 * k * (1 - k);
      sy = 1 + 0.16 * (1 - k) * Math.sin(k * Math.PI * 1.5);
      sxz = 1 / Math.sqrt(sy);
      giroY = facil(k) * Math.PI * 2;
      const brazos = Math.sin(k * Math.PI);
      hD = lerp(hD, 2.6, brazos); hI = lerp(hI, -2.6, brazos);
      levD = levI = brazos * 0.1;
    } else if (s < A + V + L) {
      const k = (s - A - V) / L;
      sy = 1 - 0.2 * Math.sin(k * Math.PI); sxz = 1 + 0.12 * Math.sin(k * Math.PI);
    } else {
      estado.salto = -1;
    }
  }

  monstruo.position.y = y;
  monstruo.scale.set(sxz, sy, sxz);
  monstruo.rotation.set(0, giroY, balanceo);
  brazoD.hombro.rotation.z = hD; brazoD.codo.rotation.z = cD; brazoD.mano.rotation.z = mD;
  brazoI.hombro.rotation.z = hI; brazoI.codo.rotation.z = cI;
  piernaD.position.y = 0.6 + levD; piernaD.rotation.x = -levD * 2;
  piernaI.position.y = 0.6 + levI; piernaI.rotation.x = -levI * 2;

  // Parpadeo (a veces doble)
  if (t > estado.proxParpadeo) {
    estado.inicioParpadeo = t;
    estado.doble = Math.random() < 0.25;
    estado.proxParpadeo = t + 2 + Math.random() * 3;
  }
  let cierre = 0;
  const dp = t - estado.inicioParpadeo;
  if (dp >= 0 && dp < 0.16) cierre = Math.sin(dp / 0.16 * Math.PI);
  else if (estado.doble && dp >= 0.22 && dp < 0.38) cierre = Math.sin((dp - 0.22) / 0.16 * Math.PI);
  // Los ojos siguen al dedo / puntero
  mirada.lerp(puntero, 0.08);
  ojos.forEach(({ ojo, pupila }) => {
    ojo.scale.y = 1 - 0.93 * cierre;
    pupila.position.x = mirada.x * 0.06;
    pupila.position.y = mirada.y * 0.05;
  });

  controles.update();
  renderer.render(escena, camara);
}

function ajustar() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camara.aspect = w / h;
  camara.fov = w / h < 0.8 ? 58 : 35;
  camara.updateProjectionMatrix();
}
window.addEventListener('resize', ajustar);
ajustar();

// ---------- Interacción ----------
const rayo = new THREE.Raycaster();
let bajada = null;
lienzo.addEventListener('pointermove', e => {
  puntero.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
});
lienzo.addEventListener('pointerdown', e => { bajada = { x: e.clientX, y: e.clientY }; });
lienzo.addEventListener('pointerup', e => {
  if (!bajada || Math.hypot(e.clientX - bajada.x, e.clientY - bajada.y) > 8) return;
  const ndc = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  puntero.copy(ndc);
  rayo.setFromCamera(ndc, camara);
  if (rayo.intersectObject(monstruo, true).length) saltar();
});

document.getElementById('bSaludar').onclick = saludar;
document.getElementById('bSaltar').onclick = saltar;
document.getElementById('bBailar').onclick = e => {
  estado.baile = !estado.baile;
  e.currentTarget.classList.toggle('activo', estado.baile);
  e.currentTarget.textContent = estado.baile ? '⏹ Parar' : '💃 Bailar';
};
document.getElementById('bEstilo').onclick = e => {
  const ver = !contornos[0].visible;
  contornos.forEach(o => o.visible = ver);
  e.currentTarget.classList.toggle('activo', ver);
  e.currentTarget.textContent = ver ? '🧸 Estilo plastilina' : '✏️ Estilo dibujo';
};

renderer.setAnimationLoop(animar);
window.__monstruoListo = true;
document.getElementById('cargando').classList.add('fuera');
</script>
